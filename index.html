<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Rebel Library - Windows 98 Login</title>

<style>
:root{
  --desktop-bg:#008080;
  --win-face:#c0c0c0;
  --win-shadow:#000;
  --win-hilight:#fff;
  --win-gray:#808080;
  --win-blue1:#000080;
  --win-blue2:#1084d0;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  font-family:"Tahoma","MS Sans Serif",sans-serif;
  background:#000;
}

/* =========================
   LOGIN SCREEN
========================= */

#login-screen{
  position:fixed;
  inset:0;
  background:#008080;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
}

.login-window{
  width:420px;
  background:var(--win-face);

  border-top:2px solid var(--win-hilight);
  border-left:2px solid var(--win-hilight);
  border-right:2px solid var(--win-shadow);
  border-bottom:2px solid var(--win-shadow);

  box-shadow:4px 4px 0 rgba(0,0,0,.4);
}

.title-bar{
  background:linear-gradient(to right,var(--win-blue1),var(--win-blue2));
  color:#fff;
  padding:4px 6px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title-buttons{
  display:flex;
  gap:2px;
}

.title-buttons button{
  width:16px;
  height:14px;
  border-top:1px solid var(--win-hilight);
  border-left:1px solid var(--win-hilight);
  border-right:1px solid var(--win-shadow);
  border-bottom:1px solid var(--win-shadow);
  background:var(--win-face);
  font-size:10px;
  padding:0;
}

.login-body{
  padding:20px;
}

.login-top{
  display:flex;
  gap:20px;
  align-items:flex-start;
}

.login-avatar{
  width:64px;
  height:64px;
  background:#000080;
  border-top:2px solid var(--win-shadow);
  border-left:2px solid var(--win-shadow);
  border-right:2px solid var(--win-hilight);
  border-bottom:2px solid var(--win-hilight);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:42px;
  color:#fff;
}

.login-fields{
  flex:1;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  margin-bottom:4px;
}

.field input{
  width:100%;
  padding:4px;
  border-top:2px solid var(--win-shadow);
  border-left:2px solid var(--win-shadow);
  border-right:2px solid var(--win-hilight);
  border-bottom:2px solid var(--win-hilight);

  background:#fff;
  font-family:Tahoma,sans-serif;
}

.button-row{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

.win98-btn{
  min-width:80px;
  padding:4px 10px;
  background:var(--win-face);

  border-top:2px solid var(--win-hilight);
  border-left:2px solid var(--win-hilight);
  border-right:2px solid var(--win-shadow);
  border-bottom:2px solid var(--win-shadow);

  cursor:pointer;
}

.win98-btn:active{
  border-top:2px solid var(--win-shadow);
  border-left:2px solid var(--win-shadow);
  border-right:2px solid var(--win-hilight);
  border-bottom:2px solid var(--win-hilight);
}

#login-message{
  margin-top:10px;
  color:red;
  font-size:12px;
  min-height:16px;
}

/* =========================
   DESKTOP
========================= */

#desktop{
  display:none;
  position:fixed;
  inset:0;
  background:#008080;
}

.desktop-icon{
  position:absolute;
  width:80px;
  text-align:center;
  color:#fff;
  cursor:pointer;
}

.desktop-icon img{
  width:32px;
  height:32px;
  image-rendering:pixelated;
}

.desktop-icon span{
  display:block;
  margin-top:5px;
  text-shadow:1px 1px 1px #000;
}

#taskbar{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:30px;
  background:#c0c0c0;

  border-top:2px solid #fff;

  display:flex;
  align-items:center;
}

#start-button{
  margin-left:2px;
  padding:3px 10px;
  font-weight:bold;
  background:#c0c0c0;

  border-top:2px solid #fff;
  border-left:2px solid #fff;
  border-right:2px solid #000;
  border-bottom:2px solid #000;

  cursor:pointer;
}

.window{
  position:absolute;
  top:100px;
  left:200px;
  width:500px;
  height:400px;

  background:#c0c0c0;

  border-top:2px solid #fff;
  border-left:2px solid #fff;
  border-right:2px solid #000;
  border-bottom:2px solid #000;

  display:none;
}

.window .title-bar{
  cursor:move;
}

.window-body{
  height:calc(100% - 26px);
  background:#fff;
}

.window-body iframe{
  width:100%;
  height:100%;
  border:none;
}

/* =========================
   BOOT SCREEN
========================= */

#boot-screen{
  position:fixed;
  inset:0;
  background:black;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999999;
  font-family:"Lucida Console",monospace;
}

.boot-text{
  margin-top:20px;
  font-size:18px;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

</style>
</head>

<body>

<!-- =========================
     BOOT SCREEN
========================= -->

<div id="boot-screen">
  <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" width="120">
  <div class="boot-text">Starting Windows 98...</div>
</div>

<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="login-screen">

  <div class="login-window">

    <div class="title-bar">
      <span>Log On to Windows</span>

      <div class="title-buttons">
        <button>X</button>
      </div>
    </div>

    <div class="login-body">

      <div class="login-top">

        <div class="login-avatar">
          👤
        </div>

        <div class="login-fields">

          <div class="field">
            <label>User name:</label>
            <input type="text" id="username" value="Andrew">
          </div>

          <div class="field">
            <label>Password:</label>
            <input type="password" id="password">
          </div>

        </div>

      </div>

      <div id="login-message"></div>

      <div class="button-row">
        <button class="win98-btn" id="login-btn">OK</button>
        <button class="win98-btn">Cancel</button>
      </div>

    </div>

  </div>

</div>

<!-- =========================
     DESKTOP
========================= -->

<div id="desktop">

  <div class="desktop-icon" style="top:30px;left:30px;" onclick="openWindow()">
    <img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png">
    <span>The Rebel Library</span>
  </div>

  <div class="window" id="main-window">

    <div class="title-bar">
      <span>The Rebel Library</span>
    </div>

    <div class="window-body">
      <iframe src="https://truenas.the-rebel-library.com"></iframe>
    </div>

  </div>

  <div id="taskbar">
    <button id="start-button">Start</button>
  </div>

</div>

<script>

/* =========================
   BOOT SEQUENCE
========================= */

setTimeout(() => {
  document.getElementById("boot-screen").style.display = "none";
}, 2500);

/* =========================
   LOGIN
========================= */

const loginBtn = document.getElementById("login-btn");

loginBtn.addEventListener("click", login);

document.getElementById("password").addEventListener("keydown",(e)=>{
  if(e.key === "Enter"){
    login();
  }
});

function login(){

  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;
  const msg = document.getElementById("login-message");

  /*
    FAKE LOGIN
    Change these values if wanted
  */

  if(user === "Andrew" && pass === "homelab"){

    msg.style.color = "green";
    msg.textContent = "Loading personal settings...";

    setTimeout(()=>{
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("desktop").style.display = "block";
    },1200);

  }else{

    msg.style.color = "red";
    msg.textContent = "Invalid password. Try again.";

  }
}

/* =========================
   WINDOW OPEN
========================= */

function openWindow(){
  document.getElementById("main-window").style.display = "block";
}

/* =========================
   DRAG WINDOW
========================= */

const win = document.getElementById("main-window");
const titleBar = win.querySelector(".title-bar");

let dragging = false;
let offsetX = 0;
let offsetY = 0;

titleBar.addEventListener("mousedown",(e)=>{
  dragging = true;
  offsetX = e.clientX - win.offsetLeft;
  offsetY = e.clientY - win.offsetTop;
});

document.addEventListener("mousemove",(e)=>{
  if(!dragging) return;

  win.style.left = (e.clientX - offsetX) + "px";
  win.style.top = (e.clientY - offsetY) + "px";
});

document.addEventListener("mouseup",()=>{
  dragging = false;
});

</script>

</body>
</html>
